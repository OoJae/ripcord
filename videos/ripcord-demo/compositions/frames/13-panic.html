<template data-info="13-panic — the film's only full-bleed colour flood; void-black on fire-orange">
  <style>
    /* ---- fonts (staged local files only, project-root relative) ---- */
    @font-face {
      font-family: "Clash Display";
      font-style: normal;
      font-weight: 600;
      font-display: block;
      src: url("assets/fonts/ClashDisplay-Regular.woff2") format("woff2");
    }
    @font-face {
      font-family: "Space Mono";
      font-style: normal;
      font-weight: 400;
      font-display: block;
      src: url("assets/fonts/SpaceMono-Regular.woff2") format("woff2");
    }

    /* ---- frame root (contract: styled via #root, never a class) ---- */
    #root {
      position: relative;
      width: 1920px;
      height: 1080px;
      overflow: hidden;
      container-type: size;
    }

    /* ---- track 0 — THE flood. The one full-bleed colour field in the film.
           Full-duration clip layer, never a background on #root. ---- */
    [id="f13-panic-ground"] {
      position: absolute;
      inset: 0;
      background: #ff4f00;
    }

    /* ---- track 1 — PANIC. Void-black on fire-orange; ink-on-fire is absolute. ---- */
    [id="f13-panic-word"] {
      position: absolute;
      left: 0;
      top: 300px;
      width: 1920px;
      text-align: center;
      transform-origin: 50% 50%;
      will-change: transform;
    }
    [id="f13-panic-word-in"] {
      display: block;
      font-family: "Clash Display", sans-serif;
      font-weight: 600;
      font-size: 11cqw;
      line-height: 1;
      letter-spacing: -0.03em;
      text-transform: uppercase;
      color: #0a0b10;
      will-change: transform;
    }

    /* ---- track 2 — the qualifier, mono caps at 75% ink ---- */
    [id="f13-panic-sub"] {
      position: absolute;
      left: 0;
      top: 552px;
      width: 1920px;
      text-align: center;
      will-change: transform;
    }
    [id="f13-panic-sub-in"] {
      display: block;
      font-family: "Space Mono", monospace;
      font-weight: 400;
      font-size: 1.35cqw;
      line-height: 1;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(10, 11, 16, 0.75);
    }

    /* ---- track 3 — the statement takes the centre ---- */
    [id="f13-panic-line"] {
      position: absolute;
      left: 200px;
      top: 470px;
      width: 1520px;
      text-align: center;
    }
    .f13-row {
      display: block;
      font-family: "Clash Display", sans-serif;
      font-weight: 600;
      font-size: 4cqw;
      line-height: 1.15;
      letter-spacing: -0.02em;
      text-transform: uppercase;
      color: #0a0b10;
      white-space: nowrap;
      will-change: transform;
    }
  </style>

  <div
    id="root"
    data-composition-id="13-panic"
    data-width="1920"
    data-height="1080"
    data-duration="5.06"
  >
    <!-- track 0 — the flood -->
    <div
      id="f13-panic-ground"
      class="clip"
      data-start="0"
      data-duration="5.06"
      data-track-index="0"
    ></div>

    <!-- track 1 — PANIC -->
    <div
      id="f13-panic-word"
      class="clip"
      data-start="0"
      data-duration="5.06"
      data-track-index="1"
    >
      <span id="f13-panic-word-in">Panic</span>
    </div>

    <!-- track 2 — the qualifier -->
    <div
      id="f13-panic-sub"
      class="clip"
      data-start="0"
      data-duration="5.06"
      data-track-index="2"
    >
      <span id="f13-panic-sub-in">HF &lt; 1.10 &middot; overrides every mode</span>
    </div>

    <!-- track 3 — the statement -->
    <div
      id="f13-panic-line"
      class="clip"
      data-start="1.3"
      data-duration="3.76"
      data-track-index="3"
    >
      <span id="f13-panic-row-1" class="f13-row">An unreachable owner</span>
      <span id="f13-panic-row-2" class="f13-row">shouldn&rsquo;t become a liquidation.</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var byId = function (id) {
        return document.getElementById(id);
      };

      var tl = gsap.timeline({ paused: true });

      /* ---------------------------------------------------------------
         Scene 1 (0.0–1.3) — hard cut into the flood. PANIC lands with ONE
         hard scale-down from 1.04; the mono qualifier follows underneath.
         Entrance and the Scene-2 move live on separate elements (inner /
         outer) so no two tweens ever share a transform channel.
         --------------------------------------------------------------- */
      tl.fromTo(
        byId("f13-panic-word-in"),
        { opacity: 0, scale: 1.04 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "expo.out" },
        0
      );
      tl.fromTo(
        byId("f13-panic-sub-in"),
        { opacity: 0, y: 14 },
        { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
        0.3
      );

      /* ---------------------------------------------------------------
         Scene 2 (1.3–3.0) — on "an unreachable owner": the headline shrinks
         to the upper third on ONE ease, the qualifier rides up with it, and
         the statement takes the centre.
         --------------------------------------------------------------- */
      tl.to(
        byId("f13-panic-word"),
        { scale: 0.44, y: -164, duration: 1.0, ease: "power3.inOut" },
        1.3
      );
      tl.to(byId("f13-panic-sub"), { y: -234, duration: 1.0, ease: "power3.inOut" }, 1.3);

      tl.fromTo(
        byId("f13-panic-row-1"),
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" },
        1.85
      );
      tl.fromTo(
        byId("f13-panic-row-2"),
        { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.85, ease: "power3.out" },
        1.97
      );

      /* ---------------------------------------------------------------
         Scene 3 (3.0–4.56) — absolute stillness on the orange field.
         No drift, no exit. The pad only carries the playhead to 4.56.
         --------------------------------------------------------------- */
      tl.to({}, { duration: 0.01 }, 4.55);

      window.__timelines["13-panic"] = tl;
    })();
  </script>
</template>
