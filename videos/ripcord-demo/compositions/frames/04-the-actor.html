  <script>
    (function () {
      var FRAME_ID = "04-the-actor";
      var DURATION = 5.72;

      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({ paused: true });

      var ring = document.querySelector(".f04-actor-ring");
      var cords = Array.prototype.slice.call(
        document.querySelectorAll(".f04-actor-cord")
      );
      var frag = document.querySelector(".f04-actor-frag");
      var def = document.querySelector(".f04-actor-def");

      // measured geometry for the draw-on (data-len is the fallback if the
      // element has not been laid out when this runs)
      function dashPrime(el) {
        var len = 0;
        if (el && typeof el.getTotalLength === "function") len = el.getTotalLength();
        if (!(len > 0)) len = parseFloat(el.getAttribute("data-len")) || 0;
        len = len * 1.02;
        el.style.strokeDasharray = String(len);
        el.style.strokeDashoffset = String(len);
        return len;
      }

      // — Scene 1 (0.0–1.4s): the orange D-ring draws, then the cords rise —
      if (ring) {
        var ringLen = dashPrime(ring);
        tl.fromTo(
          ring,
          { strokeDashoffset: ringLen },
          { strokeDashoffset: 0, duration: 0.8, ease: "power2.out" },
          0.1
        );
      }
      cords.forEach(function (cord, i) {
        var len = dashPrime(cord);
        tl.fromTo(
          cord,
          { strokeDashoffset: len },
          { strokeDashoffset: 0, duration: 0.46, ease: "power2.out" },
          0.78 + i * 0.1
        );
      });

      // the rip sits OPEN until Scene 3 — pinned at t=0 so any seek lands on it
      if (frag) tl.set(frag, { x: 140, y: 88 }, 0);

      // — Scene 2 (1.4–3.0s): the letters cascade out of the ring, 40ms apart —
      for (var i = 0; i < 7; i++) {
        var glyphs = document.querySelectorAll(
          '.f04-actor-ltr[data-ltr="' + i + '"]'
        );
        if (!glyphs.length) continue;
        tl.fromTo(
          glyphs,
          { x: -150, opacity: 0 },
          { x: 0, opacity: 1, duration: 0.55, ease: "back.out(1.15)" },
          1.45 + i * 0.04
        );
      }

      // — Scene 3 (3.0–4.3s): the signature beat. The rip CLOSES on one
      //   expressive ease and nothing else moves.
      if (frag) {
        tl.fromTo(
          frag,
          { x: 140, y: 88 },
          { x: 14, y: 26, duration: 0.85, ease: "expo.out" },
          3.05
        );
      }

      // — Scene 4 (4.3–5.72s): the mono definition fades up, then hold still —
      if (def) {
        tl.fromTo(
          def,
          { y: 12, opacity: 0 },
          { y: 0, opacity: 1, duration: 0.75, ease: "power3.out" },
          4.35
        );
      }

      // holds the timeline to the frame's full length; no motion of its own
      tl.to({}, { duration: DURATION }, 0);

      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
