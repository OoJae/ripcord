  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      window.__timelines = window.__timelines || {};

      var root = document.querySelector('[data-composition-id="11-the-guard"]');
      if (!root) return;
      var q = function (sel) { return root.querySelector(sel); };
      var tl = gsap.timeline({ paused: true });

      /* macro drift under everything; the frame itself never moves */
      tl.fromTo(q("#f11-weave"), { scale: 1, y: 0 },
        { scale: 1.04, y: -8, duration: 9, ease: "sine.inOut" }, 0);

      /* ---------------------------------------------------------------
         Scene 1 (0.0-1.4) — the heading. Hero on screen well before 0.5s.
         --------------------------------------------------------------- */
      tl.fromTo(q("#f11-stub"), { scaleX: 0 },
        { scaleX: 1, duration: 0.44, ease: "power2.out" }, 0.06);
      tl.fromTo(q("#f11-title"), { opacity: 0, y: 26 },
        { opacity: 1, y: 0, duration: 0.68, ease: "power3.out" }, 0.12);
      tl.fromTo(q("#f11-sub"), { opacity: 0, y: 12 },
        { opacity: 1, y: 0, duration: 0.55, ease: "power2.out" }, 0.58);

      /* ---------------------------------------------------------------
         Scene 2 (1.4-5.0) — the fourteen real rule ids cascade into the
         wrapped grid 70ms apart, dim; then a second pass walks the array
         and lights each chip as the Guard evaluates it. Nothing here is a
         clock — every step is a fixed offset on the one paused timeline.
         --------------------------------------------------------------- */
      var i;
      for (i = 1; i <= 14; i++) {
        tl.fromTo(q("#f11-chip-" + i), { opacity: 0, y: 16 },
          { opacity: 1, y: 0, duration: 0.5, ease: "power3.out" }, 1.4 + (i - 1) * 0.07);
      }
      for (i = 1; i <= 14; i++) {
        tl.fromTo(q("#f11-lit-" + i), { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "sine.out" }, 3.05 + (i - 1) * 0.114);
        tl.fromTo(q("#f11-on-" + i), { opacity: 0 },
          { opacity: 1, duration: 0.4, ease: "sine.out" }, 3.05 + (i - 1) * 0.114);
      }

      /* ---------------------------------------------------------------
         Scene 3 (5.0-7.0) — the grid drops to 40% and the real captured
         verdict stamps across it. Fire-orange only; no phosphor lives in
         this frame at all.
         --------------------------------------------------------------- */
      tl.fromTo(q("#f11-rules"), { opacity: 1 },
        { opacity: 0.4, duration: 0.6, ease: "sine.inOut" }, 5.0);
      tl.fromTo(q("#f11-verdict"), { opacity: 0, scaleX: 0.965 },
        { opacity: 1, scaleX: 1, duration: 0.52, ease: "power3.out" }, 5.06);
      tl.fromTo(q("#f11-verdict-text"), { opacity: 0, scale: 1.045 },
        { opacity: 1, scale: 1, duration: 0.36, ease: "power4.out" }, 5.3);

      /* ---------------------------------------------------------------
         Scene 4 (7.0-9.0) — the coda settles beneath, word by word, and
         the frame holds dead still. This line is the argument.
         --------------------------------------------------------------- */
      for (i = 1; i <= 12; i++) {
        tl.fromTo(q("#f11-cw-" + i), { opacity: 0, y: 10 },
          { opacity: 1, y: 0, duration: 0.42, ease: "power2.out" }, 7.0 + (i - 1) * 0.062);
      }

      /* hold out the full window — no exit; the root transition is the exit */
      tl.to({}, { duration: 0.01 }, 8.99);

      window.__timelines["11-the-guard"] = tl;
    })();
  </script>
