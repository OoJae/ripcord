  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    (function () {
      var FRAME_ID = "15-pull-before-the-drop";
      var DURATION = 8.5;

      window.__timelines = window.__timelines || {};

      var byId = function (id) {
        return document.getElementById(id);
      };

      var tl = gsap.timeline({ paused: true });

      var fact1 = byId("f15-pull-fact-1");
      var fact2 = byId("f15-pull-fact-2");
      var fact3 = byId("f15-pull-fact-3");
      var rule1 = byId("f15-pull-rule-1");
      var rule2 = byId("f15-pull-rule-2");

      /* ---------------------------------------------------------------
         Scene 1 (0.00–3.40) — the void. One fact per spoken beat, 0.9s
         apart, each hairline arriving just ahead of the line it separates.
         Nothing else is on stage: the count is up before 0.5s.
         --------------------------------------------------------------- */
      tl.fromTo(
        fact1,
        { autoAlpha: 0, y: 22 },
        { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out" },
        0.1
      );

      tl.fromTo(
        rule1,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        0.92
      );
      tl.fromTo(
        fact2,
        { autoAlpha: 0, y: 22 },
        { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out" },
        1.0
      );

      tl.fromTo(
        rule2,
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        1.82
      );
      tl.fromTo(
        fact3,
        { autoAlpha: 0, y: 22 },
        { autoAlpha: 1, y: 0, duration: 0.7, ease: "power3.out" },
        1.9
      );

      /* ---------------------------------------------------------------
         Scene 2 (3.40–5.40) — on "Ripcord": the ledger clears in one breath
         (autoAlpha kills them outright, no ghost left on the plane) and the
         mark BLOOMS whole from the empty stage — one smooth long-tail
         settle, no overshoot, no parts. Frame 4 tore the rip open and shut
         it; this is that build already resolved.
         --------------------------------------------------------------- */
      tl.to(
        [fact1, rule1, fact2, rule2, fact3],
        { autoAlpha: 0, duration: 0.5, ease: "power2.inOut" },
        3.4
      );

      tl.fromTo(
        byId("f15-pull-mark"),
        { autoAlpha: 0, scale: 0.7, transformOrigin: "50% 50%" },
        {
          autoAlpha: 1,
          scale: 1,
          duration: 1.05,
          ease: "power3.out",
          transformOrigin: "50% 50%",
        },
        3.95
      );

      /* ---------------------------------------------------------------
         Scene 3 (5.40–8.50) — on "pull before the drop": the tagline lands
         under the mark, the live address settles under that, and the film
         stops moving. A held, still lockup — the last thing on screen.
         --------------------------------------------------------------- */
      tl.fromTo(
        byId("f15-pull-tagline"),
        { autoAlpha: 0, y: 18 },
        { autoAlpha: 1, y: 0, duration: 0.8, ease: "power3.out" },
        5.45
      );
      tl.fromTo(
        byId("f15-pull-url"),
        { autoAlpha: 0, y: 12 },
        { autoAlpha: 1, y: 0, duration: 0.7, ease: "power2.out" },
        6.15
      );

      /* 6.85–8.50: dead still. No fade-out — the lockup holds to the cut. */
      tl.to({}, { duration: 0.01 }, DURATION - 0.01);

      window.__timelines[FRAME_ID] = tl;
    })();
  </script>
