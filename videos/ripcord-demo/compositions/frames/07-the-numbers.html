<template>

  <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
  <script>
    window.__timelines = window.__timelines || {};
    (function () {
      var tl = gsap.timeline({ paused: true });

      var countEl = document.getElementById("f07-count");
      var state = { value: 0 };

      /* ---------- Scene 1 (0.0-3.0s): void; 21s counts up, centre-left ----------
         counting-dynamic-scale: value + transform scale share ONE decelerating
         ease and one duration; font-size is static, only the transform moves. */
      tl.fromTo(
        "#f07-hair-a",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.6, ease: "power2.out" },
        0.04
      );
      tl.fromTo("#f07-m1", { autoAlpha: 0 }, { autoAlpha: 1, duration: 0.35, ease: "power2.out" }, 0.1);
      tl.to(
        state,
        {
          value: 21,
          duration: 2.0,
          ease: "power3.out",
          // modifiers, NOT onUpdate: the renderer seeks with
          // totalTime(t, suppressEvents) and GSAP suppresses onUpdate on a
          // seek — the counter would render frozen at 0 in the MP4 while
          // looking correct in live preview. modifiers runs inside every
          // render pass, so the value is right at any playhead.
          modifiers: {
            value: function (v) {
              countEl.textContent = String(Math.round(v));
              return v;
            },
          },
        },
        0.12
      );
      tl.fromTo(
        "#f07-count",
        { scale: 0.55 },
        { scale: 1, duration: 2.0, ease: "power3.out" },
        0.12
      );
      tl.fromTo(
        "#f07-l1",
        { autoAlpha: 0, y: 16 },
        { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" },
        0.9
      );
      /* the unit gets its own beat, after the digits land — no overshoot */
      tl.fromTo(
        "#f07-unit",
        { autoAlpha: 0, y: 22 },
        { autoAlpha: 1, y: 0, duration: 0.42, ease: "power3.out" },
        2.14
      );

      /* ---------- Scene 2 (3.0-5.2s): "gas sponsored" — right column slides up ---------- */
      tl.fromTo(
        "#f07-hair-b",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.5, ease: "power2.out" },
        2.94
      );
      tl.fromTo(
        "#f07-m2",
        { autoAlpha: 0, y: 46 },
        { autoAlpha: 1, y: 0, duration: 0.8, ease: "power3.out" },
        3.04
      );
      tl.fromTo(
        "#f07-l2a",
        { autoAlpha: 0, y: 18 },
        { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out" },
        3.52
      );
      tl.fromTo(
        "#f07-l2b",
        { autoAlpha: 0, y: 18 },
        { autoAlpha: 1, y: 0, duration: 0.55, ease: "power3.out" },
        4.28
      );

      /* ---------- Scene 3 (5.2-8.56s): the payoff lands centre ----------
         The two measurements dim to 35% (a recede, not an exit) and the
         recovered health factor arrives on ONE scale-down from 1.05. */
      tl.fromTo(
        ["#f07-col-a", "#f07-col-b"],
        { opacity: 1 },
        { opacity: 0.35, duration: 0.7, ease: "power2.inOut" },
        5.12
      );
      tl.fromTo(
        "#f07-payhair",
        { scaleX: 0 },
        { scaleX: 1, duration: 0.55, ease: "power2.out" },
        5.28
      );
      tl.fromTo(
        "#f07-hf",
        { autoAlpha: 0, scale: 1.05 },
        { autoAlpha: 1, scale: 1, duration: 0.9, ease: "power3.out" },
        5.42
      );
      tl.fromTo(
        "#f07-l3",
        { autoAlpha: 0, y: 18 },
        { autoAlpha: 1, y: 0, duration: 0.6, ease: "power3.out" },
        6.16
      );

      /* 6.76-8.56s: dead still. The hold on the recovered number is the payoff. */

      window.__timelines["07-the-numbers"] = tl;
    })();
  </script>
